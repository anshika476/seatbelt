[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seatbelt"
dynamic = ["version"]
description = "Action guardrails for AI agents: every tool call is adjudicated before it runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anshika Goel" }]
keywords = ["ai-agents", "guardrails", "security", "policy", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
seatbelt = "seatbelt.cli:main"

[project.urls]
Documentation = "https://github.com/anshika-goel/seatbelt#readme"

[tool.setuptools.dynamic]
version = { attr = "seatbelt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
